<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Staff Ledger</title>
<script src="vendor/react.min.js"></script>
<script src="vendor/react-dom.min.js"></script>
<script src="vendor/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f6f2e8; --rule: rgba(30,42,58,0.06);
    --card: #fbf9f2; --border: #e3dcc9; --input-border: #cfc6ae;
    --text: #1e2a3a; --muted: #7a7466; --soft: #efe9da;
    --accent: #1e2a3a; --on-accent: #fdfcf8;
    --green: #3e7d54; --amber: #c8871e; --red: #a43c35; --on-color: #fdfcf8;
    --tan: #f0e3c2; --seg: #e7e0cd;
    --pill-bg: #e8e2d0; --pill-text: #5c563f;
    --shadow: rgba(30,42,58,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1814; --rule: rgba(255,255,255,0.045);
      --card: #232019; --border: #3a3527; --input-border: #4a4433;
      --text: #ece7d8; --muted: #a49d8a; --soft: #2c2820;
      --accent: #ece7d8; --on-accent: #1a1814;
      --green: #5aa375; --amber: #d9a13f; --red: #c96157; --on-color: #1a1814;
      --tan: #3d3722; --seg: #2c2820;
      --pill-bg: #3a3527; --pill-text: #d5cdb4;
      --shadow: rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1814; --rule: rgba(255,255,255,0.045);
    --card: #232019; --border: #3a3527; --input-border: #4a4433;
    --text: #ece7d8; --muted: #a49d8a; --soft: #2c2820;
    --accent: #ece7d8; --on-accent: #1a1814;
    --green: #5aa375; --amber: #d9a13f; --red: #c96157; --on-color: #1a1814;
    --tan: #3d3722; --seg: #2c2820;
    --pill-bg: #3a3527; --pill-text: #d5cdb4;
    --shadow: rgba(0,0,0,0.4);
  }
  :root[data-theme="light"] {
    --bg: #f6f2e8; --rule: rgba(30,42,58,0.06);
    --card: #fbf9f2; --border: #e3dcc9; --input-border: #cfc6ae;
    --text: #1e2a3a; --muted: #7a7466; --soft: #efe9da;
    --accent: #1e2a3a; --on-accent: #fdfcf8;
    --green: #3e7d54; --amber: #c8871e; --red: #a43c35; --on-color: #fdfcf8;
    --tan: #f0e3c2; --seg: #e7e0cd;
    --pill-bg: #e8e2d0; --pill-text: #5c563f;
    --shadow: rgba(30,42,58,0.08);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg);
    background-image: repeating-linear-gradient(to bottom,
      transparent 0, transparent 34px, var(--rule) 34px, var(--rule) 35px);
    color: var(--text);
    min-height: 100vh;
  }
  .shell { max-width: 520px; margin: 0 auto; padding: 16px 16px 56px; }
  .serif { font-family: Georgia, "Times New Roman", serif; font-weight: 400; }
  .brand { text-align: center; padding: 34px 0 24px; }
  .brand h1 { font-family: Georgia, "Times New Roman", serif; font-size: 32px; letter-spacing: -0.5px; }
  .brand p { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px; margin-bottom: 14px; box-shadow: 0 1px 3px var(--shadow);
  }
  .card-title { font-family: Georgia, serif; font-size: 24px; }
  .seg { display: flex; background: var(--seg); border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 16px; }
  .seg button {
    flex: 1; padding: 11px 6px; border: none; background: transparent; border-radius: 9px;
    font-size: 15px; font-weight: 600; color: var(--muted); cursor: pointer;
  }
  .seg button.active { background: var(--card); color: var(--text); box-shadow: 0 1px 2px var(--shadow); }
  .seg.auth button.active { background: var(--accent); color: var(--on-accent); }
  label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px; color: var(--text); }
  input, select {
    width: 100%; padding: 12px 13px; border: 1.5px solid var(--input-border); border-radius: 12px;
    font-size: 16px; background: var(--card); color: var(--text);
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .btn {
    width: 100%; padding: 14px; margin-top: 18px; border: none; border-radius: 12px;
    background: var(--accent); color: var(--on-accent); font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .btn.outline { background: var(--card); color: var(--text); border: 1.5px solid var(--input-border); }
  .btn.small { width: auto; padding: 9px 16px; font-size: 14px; margin-top: 0; }
  .btn.green { background: var(--green); color: var(--on-color); }
  .btn.amber { background: var(--amber); color: var(--on-color); }
  .btn.red { background: var(--red); color: var(--on-color); }
  .btn.ghost { background: transparent; border: 1.5px solid var(--input-border); color: var(--text); }
  .chip {
    border: none; border-radius: 10px; padding: 10px 16px; font-size: 14px; font-weight: 700;
    cursor: pointer; color: var(--on-color);
  }
  .chip.green { background: var(--green); }
  .chip.amber { background: var(--amber); }
  .chip.red { background: var(--red); }
  .chip.dim { opacity: 0.35; }
  .toast {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    z-index: 100; max-width: min(88vw, 420px);
    background: var(--accent); color: var(--on-accent);
    padding: 13px 18px; border-radius: 12px; font-size: 15px; font-weight: 600;
    box-shadow: 0 4px 14px var(--shadow); text-align: center;
  }
  .toast.error { background: var(--red); color: var(--on-color); }
  .biz-option {
    display: block; width: 100%; text-align: left; padding: 12px 14px; margin-top: 8px;
    border: 1.5px solid var(--border); border-radius: 12px; background: var(--tan);
    cursor: pointer; font-size: 16px; color: var(--text);
  }
  .biz-option.selected { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: -1px; }
  .biz-option .meta { display: block; font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .back-link { background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; padding: 8px 0; }
  .topbar { display: flex; justify-content: space-between; align-items: flex-start; margin: 4px 0 16px; }
  .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }
  .topbar h2 { font-family: Georgia, serif; font-size: 22px; margin-top: 3px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .emp-box {
    border: 1.5px dashed var(--input-border); border-radius: 12px; padding: 14px; margin-top: 12px;
  }
  .emp-box .actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: 14px; }
  .pill {
    font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px;
    background: var(--pill-bg); color: var(--pill-text);
  }
  .status { font-size: 15px; font-weight: 600; }
  .status.P { color: var(--green); }
  .status.H { color: var(--amber); }
  .status.L { color: var(--red); }
  .pay-box { background: var(--soft); border-radius: 12px; padding: 16px; margin-top: 12px; }
  .pay-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin-top: 10px; font-size: 15px; }
  .pay-grid .num { font-variant-numeric: tabular-nums; }
  .pay-net { font-weight: 800; }
  .big-amount { font-family: Georgia, serif; font-size: 26px; font-weight: 700; }
  .owner-link {
    display: block; margin: 26px auto 0; background: none; border: none;
    color: var(--muted); font-size: 13px; text-decoration: underline; cursor: pointer;
  }
  .home-btn {
    display: block; width: 100%; padding: 20px; margin-top: 14px; text-align: left;
    background: var(--card); border: 1.5px solid var(--border); border-radius: 16px; cursor: pointer;
    box-shadow: 0 1px 3px var(--shadow); color: var(--text);
  }
  .home-btn .t { font-family: Georgia, serif; font-size: 20px; }
  .home-btn .d { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .mini-form { margin-top: 12px; padding: 12px; background: var(--soft); border-radius: 12px; }
  .mini-form .actions { display: flex; gap: 10px; margin-top: 10px; }
  .list-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .list-item:last-child { border-bottom: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// NOTE: this app is fully client-side. The master key and all PINs are visible
// to anyone who inspects the page or localStorage — fine for personal use,
// not a real security boundary.
const SUPER_ADMIN_KEY = "kapraghar-owner-2026";
const STORAGE_KEY = "staff_ledger_data_v2";

const uid = () =>
  window.crypto && crypto.randomUUID
    ? crypto.randomUUID()
    : Date.now() + "-" + Math.random().toString(36).slice(2);

const genPin = () => String(Math.floor(1000 + Math.random() * 9000));

function loadData() {
  try {
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (d && Array.isArray(d.businesses)) return d;
  } catch (e) {}
  return { businesses: [] };
}

const fmtDate = (iso) =>
  new Date(iso).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
const fmtLongDate = (d) =>
  d.toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" });
const fmtMoney = (n) => "₹" + Math.round(Number(n || 0)).toLocaleString("en-IN");
const nowTime = () =>
  new Date().toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" });
// Attendance marks used to be plain strings; normalize to {s, t, by}
const normMark = (v) => (typeof v === "string" ? { s: v } : v || null);

const todayKey = () => {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
};
const monthKeyOf = (dateStr) => dateStr.slice(0, 7);
const fmtMonth = (mk) => {
  const [y, m] = mk.split("-").map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString("en-IN", { month: "long", year: "numeric" });
};
const daysInMonth = (mk) => {
  const [y, m] = mk.split("-").map(Number);
  return new Date(y, m, 0).getDate();
};
function monthsSince(startIso) {
  const out = [];
  const start = new Date(startIso);
  const now = new Date();
  let y = start.getFullYear(), m = start.getMonth();
  while (y < now.getFullYear() || (y === now.getFullYear() && m <= now.getMonth())) {
    out.push(y + "-" + String(m + 1).padStart(2, "0"));
    m++; if (m > 11) { m = 0; y++; }
  }
  return out.reverse();
}

// Earliest month with any activity, so backdated advances stay reachable
function monthsForBiz(biz) {
  let earliest = biz.createdAt.slice(0, 10);
  for (const d of Object.keys(biz.attendance || {})) if (d < earliest) earliest = d;
  for (const a of biz.advances || []) { const d = a.date.slice(0, 10); if (d < earliest) earliest = d; }
  return monthsSince(earliest);
}

const isPin = (s) => /^\d{4}$/.test(s);
const isPhone = (s) => /^\d{10}$/.test(s);

// Payroll for one employee in one month, from attendance + advances
function payrollFor(biz, emp, mk) {
  let present = 0, half = 0, leave = 0;
  for (const [date, marks] of Object.entries(biz.attendance || {})) {
    if (monthKeyOf(date) !== mk) continue;
    const rec = normMark(marks[emp.id]);
    if (!rec) continue;
    if (rec.s === "P") present++;
    else if (rec.s === "H") half++;
    else if (rec.s === "L") leave++;
  }
  const perDay = (emp.salary || 0) / daysInMonth(mk);
  const gross = Math.round(perDay * (present + 0.5 * half));
  const advances = (biz.advances || [])
    .filter((a) => a.employeeId === emp.id && monthKeyOf(a.date.slice(0, 10)) === mk)
    .reduce((s, a) => s + a.amount, 0);
  return { present, half, leave, gross, advances, net: gross - advances };
}

function ConfirmButton({ label, confirmLabel, className, onConfirm }) {
  const [armed, setArmed] = useState(false);
  useEffect(() => {
    if (!armed) return;
    const t = setTimeout(() => setArmed(false), 3000);
    return () => clearTimeout(t);
  }, [armed]);
  return (
    <button type="button" className={className}
      onClick={() => { if (armed) { setArmed(false); onConfirm(); } else setArmed(true); }}>
      {armed ? confirmLabel : label}
    </button>
  );
}

function BizPicker({ businesses, search, onSearch, selectedId, onSelect, label }) {
  const matches = search.trim()
    ? businesses.filter((b) => b.name.toLowerCase().includes(search.trim().toLowerCase()))
    : [];
  return (
    <div>
      <label>{label}</label>
      <input
        placeholder="Type business name…"
        value={search}
        onChange={(e) => { onSearch(e.target.value); onSelect(null); }}
      />
      {search.trim() !== "" && matches.length === 0 && (
        <div className="muted" style={{ marginTop: 8 }}>No business found with that name.</div>
      )}
      {matches.map((b) => (
        <button
          key={b.id}
          type="button"
          className={"biz-option" + (selectedId === b.id ? " selected" : "")}
          onClick={() => onSelect(b.id)}
        >
          {b.name}
          <span className="meta">
            Created {fmtDate(b.createdAt)} · {b.employees.length} employee{b.employees.length === 1 ? "" : "s"}
          </span>
        </button>
      ))}
    </div>
  );
}

function Landing({ businesses, showToast, onAdminLogin, onSignup, onEmployeeLogin, onSuperLogin }) {
  const [mode, setMode] = useState("home"); // home | admin | employee | super
  const [authTab, setAuthTab] = useState("login"); // login | signup

  const [loginSearch, setLoginSearch] = useState("");
  const [loginBizId, setLoginBizId] = useState(null);
  const [loginPin, setLoginPin] = useState("");

  const [signupName, setSignupName] = useState("");
  const [signupPin, setSignupPin] = useState("");
  const [signupConfirm, setSignupConfirm] = useState("");
  const [dupWarned, setDupWarned] = useState(false);

  const [empSearch, setEmpSearch] = useState("");
  const [empBizId, setEmpBizId] = useState(null);
  const [empPhone, setEmpPhone] = useState("");
  const [empPin, setEmpPin] = useState("");

  const [superKey, setSuperKey] = useState("");

  // Every form keeps its own PIN state; clear them all whenever the
  // screen or tab changes so digits never carry over between forms.
  const resetPins = () => { setLoginPin(""); setSignupPin(""); setSignupConfirm(""); setEmpPin(""); setSuperKey(""); setDupWarned(false); };
  const go = (m) => { setMode(m); setAuthTab("login"); resetPins(); };
  const switchAuthTab = (t) => { setAuthTab(t); resetPins(); };

  const submitAdminLogin = (e) => {
    e.preventDefault();
    const biz = businesses.find((b) => b.id === loginBizId);
    if (!biz) { showToast("Select your business from the list first", "error"); return; }
    if (biz.pin !== loginPin) {
      showToast("Wrong PIN or business", "error");
      setLoginPin("");
      return;
    }
    onAdminLogin(biz.id);
  };

  const submitSignup = (e) => {
    e.preventDefault();
    const name = signupName.trim();
    if (!name) { showToast("Enter a business name", "error"); return; }
    if (!isPin(signupPin)) { showToast("PIN must be exactly 4 digits", "error"); return; }
    if (signupPin !== signupConfirm) {
      showToast("PINs do not match — re-enter both", "error");
      setSignupPin(""); setSignupConfirm("");
      return;
    }
    const dup = businesses.find((b) => b.name.trim().toLowerCase() === name.toLowerCase());
    if (dup && !dupWarned) {
      setDupWarned(true);
      showToast('"' + dup.name + '" already exists (created ' + fmtDate(dup.createdAt) + '). Tap Create again to make a second one.', "error");
      return;
    }
    onSignup({ name, pin: signupPin });
  };

  const submitEmployeeLogin = (e) => {
    e.preventDefault();
    const biz = businesses.find((b) => b.id === empBizId);
    if (!biz) { showToast("Select your business from the list first", "error"); return; }
    const emp = biz.employees.find((x) => x.phone === empPhone.trim() && x.pin === empPin);
    if (!emp) {
      showToast("No match — check phone/PIN with your admin", "error");
      setEmpPin("");
      return;
    }
    onEmployeeLogin(biz.id, emp.id);
  };

  const submitSuper = (e) => {
    e.preventDefault();
    if (superKey === SUPER_ADMIN_KEY) { onSuperLogin(); return; }
    showToast("Wrong master key", "error");
    setSuperKey("");
  };

  if (mode === "home") {
    return (
      <div>
        <div className="brand">
          <h1>Staff Ledger</h1>
          <p>Attendance, advances &amp; payroll for your shop</p>
        </div>
        <button className="home-btn" onClick={() => go("admin")}>
          <div className="t">Business owner</div>
          <div className="d">Manage attendance, staff and payroll</div>
        </button>
        <button className="home-btn" onClick={() => go("employee")}>
          <div className="t">Employee</div>
          <div className="d">See your attendance and salary</div>
        </button>
        <button className="owner-link" onClick={() => go("super")}>Platform owner login</button>
      </div>
    );
  }

  return (
    <div>
      <button className="back-link" onClick={() => go("home")}>← back</button>

      {mode === "admin" && (
        <div className="card">
          <div className="seg auth">
            <button className={authTab === "login" ? "active" : ""} onClick={() => switchAuthTab("login")}>Login</button>
            <button className={authTab === "signup" ? "active" : ""} onClick={() => switchAuthTab("signup")}>New business</button>
          </div>

          {authTab === "login" && (
            <form onSubmit={submitAdminLogin}>
              <BizPicker
                businesses={businesses}
                search={loginSearch} onSearch={setLoginSearch}
                selectedId={loginBizId} onSelect={setLoginBizId}
                label="Find your business"
              />
              <label>PIN</label>
              <input type="password" inputMode="numeric" maxLength="4" value={loginPin}
                onChange={(e) => setLoginPin(e.target.value.replace(/\D/g, ""))} />
              <button className="btn" type="submit">Login</button>
            </form>
          )}

          {authTab === "signup" && (
            <form onSubmit={submitSignup}>
              <label>Business name</label>
              <input value={signupName} placeholder="e.g. Kapra Ghar"
                onChange={(e) => { setSignupName(e.target.value); setDupWarned(false); }} />
              <div className="grid2">
                <div>
                  <label>Choose a 4-digit PIN</label>
                  <input type="password" inputMode="numeric" maxLength="4" value={signupPin}
                    onChange={(e) => setSignupPin(e.target.value.replace(/\D/g, ""))} />
                </div>
                <div>
                  <label>Confirm PIN</label>
                  <input type="password" inputMode="numeric" maxLength="4" value={signupConfirm}
                    onChange={(e) => setSignupConfirm(e.target.value.replace(/\D/g, ""))} />
                </div>
              </div>
              <button className="btn" type="submit">Create business</button>
            </form>
          )}
        </div>
      )}

      {mode === "employee" && (
        <div className="card">
          <form onSubmit={submitEmployeeLogin}>
            <BizPicker
              businesses={businesses}
              search={empSearch} onSearch={setEmpSearch}
              selectedId={empBizId} onSelect={setEmpBizId}
              label="Your business"
            />
            <label>Phone</label>
            <input inputMode="numeric" maxLength="10" value={empPhone}
              onChange={(e) => setEmpPhone(e.target.value.replace(/\D/g, ""))} />
            <label>PIN</label>
            <input type="password" inputMode="numeric" maxLength="4" value={empPin}
              onChange={(e) => setEmpPin(e.target.value.replace(/\D/g, ""))} />
            <button className="btn" type="submit">Login</button>
          </form>
        </div>
      )}

      {mode === "super" && (
        <div className="card">
          <div className="card-title" style={{ marginBottom: 4 }}>Platform owner</div>
          <form onSubmit={submitSuper}>
            <label>Master key</label>
            <input type="password" value={superKey} onChange={(e) => setSuperKey(e.target.value)} />
            <button className="btn" type="submit">Enter</button>
          </form>
        </div>
      )}
    </div>
  );
}

function AddEmployeeForm({ business, onAdd, onCancel, showToast }) {
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [salary, setSalary] = useState("");

  const submit = (e) => {
    e.preventDefault();
    if (!name.trim()) { showToast("Enter the employee's name", "error"); return; }
    if (!isPhone(phone)) { showToast("Phone number must be exactly 10 digits", "error"); return; }
    if (business.employees.some((x) => x.phone === phone)) {
      showToast("An employee with this phone already exists here", "error");
      return;
    }
    const sal = Number(salary);
    if (!sal || sal <= 0) { showToast("Enter a monthly salary above 0", "error"); return; }
    onAdd({ name: name.trim(), phone, salary: sal });
  };

  return (
    <form onSubmit={submit}>
      <label>Name</label>
      <input value={name} onChange={(e) => setName(e.target.value)} />
      <label>Phone (used to log in)</label>
      <input inputMode="numeric" maxLength="10" value={phone}
        onChange={(e) => setPhone(e.target.value.replace(/\D/g, ""))} />
      <label>Monthly salary (₹)</label>
      <input inputMode="numeric" value={salary}
        onChange={(e) => setSalary(e.target.value.replace(/\D/g, ""))} />
      <div className="muted" style={{ marginTop: 12 }}>
        A 4-digit PIN will be generated automatically — share it with the employee so they can log in.
      </div>
      <button className="btn green" type="submit">Add employee</button>
      <button className="btn ghost" type="button" onClick={onCancel}>Cancel</button>
    </form>
  );
}

function AdminDashboard({ business, onUpdate, onLogout, showToast }) {
  const [tab, setTab] = useState("today"); // today | emps | payroll
  const [adding, setAdding] = useState(false);
  const [advanceFor, setAdvanceFor] = useState(null);
  const [advanceAmt, setAdvanceAmt] = useState("");
  const [advanceDate, setAdvanceDate] = useState(todayKey());
  const [month, setMonth] = useState(monthKeyOf(todayKey()));

  const tKey = todayKey();
  const attToday = (business.attendance || {})[tKey] || {};

  const mark = (empId, v) => {
    const attendance = { ...(business.attendance || {}) };
    attendance[tKey] = { ...(attendance[tKey] || {}), [empId]: { s: v, t: nowTime(), by: "adm" } };
    onUpdate({ ...business, attendance });
  };

  const addEmployee = ({ name, phone, salary }) => {
    const pin = genPin();
    onUpdate({
      ...business,
      employees: [...business.employees, { id: uid(), name, phone, salary, pin, createdAt: new Date().toISOString() }],
    });
    setAdding(false);
    setTab("emps");
    showToast(name + " added — share PIN " + pin + " with them");
  };

  const removeEmployee = (emp) => {
    const attendance = {};
    for (const [date, marks] of Object.entries(business.attendance || {})) {
      const rest = { ...marks };
      delete rest[emp.id];
      if (Object.keys(rest).length) attendance[date] = rest;
    }
    onUpdate({
      ...business,
      employees: business.employees.filter((x) => x.id !== emp.id),
      attendance,
      advances: (business.advances || []).filter((a) => a.employeeId !== emp.id),
    });
    showToast(emp.name + " removed");
  };

  const saveAdvance = (emp) => {
    const amt = Number(advanceAmt);
    if (!amt || amt <= 0) { showToast("Enter an advance amount above 0", "error"); return; }
    if (!advanceDate) { showToast("Pick the date of the advance", "error"); return; }
    onUpdate({
      ...business,
      advances: [...(business.advances || []), {
        id: uid(), employeeId: emp.id, amount: amt,
        date: advanceDate, recordedAt: new Date().toISOString(),
      }],
    });
    setAdvanceFor(null);
    setAdvanceAmt("");
    showToast("Advance of " + fmtMoney(amt) + " on " + fmtDate(advanceDate) + " recorded for " + emp.name);
  };

  const removeAdvance = (adv) => {
    onUpdate({ ...business, advances: (business.advances || []).filter((a) => a.id !== adv.id) });
    showToast("Advance of " + fmtMoney(adv.amount) + " deleted");
  };

  const statusLabel = { P: "Present", H: "Half-day", L: "Leave" };

  return (
    <div>
      <div className="topbar">
        <div>
          <div className="eyebrow">Admin</div>
          <h2>{business.name}</h2>
        </div>
        <button className="btn outline small" onClick={onLogout}>Log out</button>
      </div>

      <div className="seg">
        <button className={tab === "today" ? "active" : ""} onClick={() => setTab("today")}>Today</button>
        <button className={tab === "emps" ? "active" : ""} onClick={() => { setTab("emps"); setAdding(false); }}>Employees</button>
        <button className={tab === "payroll" ? "active" : ""} onClick={() => setTab("payroll")}>Payroll</button>
      </div>

      {tab === "today" && (
        <div className="card">
          <div className="card-title">Attendance — {fmtLongDate(new Date())}</div>
          {business.employees.length === 0 && (
            <div className="muted" style={{ marginTop: 12 }}>No employees yet — add them in the Employees tab.</div>
          )}
          {business.employees.map((emp) => {
            const rec = normMark(attToday[emp.id]);
            const v = rec && rec.s;
            return (
              <div key={emp.id} className="emp-box">
                <div className="row">
                  <div style={{ fontWeight: 700, fontSize: 17 }}>{emp.name}</div>
                  <div className={"status " + (v || "")}>
                    {rec ? statusLabel[v] + (rec.t ? " · " + rec.t : "") + (rec.by === "emp" ? " (self)" : "") : "Not marked"}
                  </div>
                </div>
                <div className="actions" style={{ display: "flex", gap: 10, marginTop: 12 }}>
                  <button className={"chip green" + (v && v !== "P" ? " dim" : "")} onClick={() => mark(emp.id, "P")}>Present</button>
                  <button className={"chip amber" + (v && v !== "H" ? " dim" : "")} onClick={() => mark(emp.id, "H")}>Half-day</button>
                  <button className={"chip red" + (v && v !== "L" ? " dim" : "")} onClick={() => mark(emp.id, "L")}>Leave</button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {tab === "emps" && (
        <div className="card">
          {adding ? (
            <div>
              <div className="card-title">Add employee</div>
              <AddEmployeeForm business={business} onAdd={addEmployee} onCancel={() => setAdding(false)} showToast={showToast} />
            </div>
          ) : (
            <div>
              <div className="row">
                <div className="card-title">Employees ({business.employees.length})</div>
                <button className="btn green small" onClick={() => setAdding(true)}>+ Add</button>
              </div>
              {business.employees.length === 0 && (
                <div className="muted" style={{ marginTop: 12 }}>No employees yet. Tap + Add to create the first one.</div>
              )}
              {business.employees.map((emp) => (
                <div key={emp.id} className="emp-box">
                  <div className="row">
                    <div style={{ fontWeight: 700, fontSize: 17 }}>{emp.name}</div>
                    <div className="muted">{fmtMoney(emp.salary)}/mo · PIN {emp.pin}</div>
                  </div>
                  <div className="muted" style={{ marginTop: 4 }}>{emp.phone}</div>
                  {advanceFor === emp.id ? (
                    <div className="mini-form">
                      <div className="grid2">
                        <div>
                          <label style={{ marginTop: 0 }}>Amount (₹)</label>
                          <input inputMode="numeric" value={advanceAmt} autoFocus
                            onChange={(e) => setAdvanceAmt(e.target.value.replace(/\D/g, ""))} />
                        </div>
                        <div>
                          <label style={{ marginTop: 0 }}>Date given</label>
                          <input type="date" value={advanceDate} max={todayKey()}
                            onChange={(e) => setAdvanceDate(e.target.value)} />
                        </div>
                      </div>
                      <div className="actions">
                        <button className="chip amber" onClick={() => saveAdvance(emp)}>Save advance</button>
                        <button className="btn ghost small" onClick={() => { setAdvanceFor(null); setAdvanceAmt(""); }}>Cancel</button>
                      </div>
                    </div>
                  ) : (
                    <div className="actions">
                      <button className="chip amber" onClick={() => { setAdvanceFor(emp.id); setAdvanceAmt(""); setAdvanceDate(todayKey()); }}>Advance</button>
                      <ConfirmButton className="chip red" label="Remove" confirmLabel="Tap again to confirm"
                        onConfirm={() => removeEmployee(emp)} />
                    </div>
                  )}
                  {(business.advances || []).some((a) => a.employeeId === emp.id) && (
                    <div style={{ marginTop: 12 }}>
                      <div className="muted" style={{ fontWeight: 700, marginBottom: 2 }}>Advances given</div>
                      {(business.advances || [])
                        .filter((a) => a.employeeId === emp.id)
                        .sort((a, b) => (a.date < b.date ? 1 : -1))
                        .map((a) => (
                          <div key={a.id} className="list-item row">
                            <div className="muted">{fmtDate(a.date)}</div>
                            <div className="row" style={{ gap: 12 }}>
                              <span style={{ fontWeight: 700 }}>{fmtMoney(a.amount)}</span>
                              <ConfirmButton className="btn ghost small" label="✕" confirmLabel="Delete?"
                                onConfirm={() => removeAdvance(a)} />
                            </div>
                          </div>
                        ))}
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {tab === "payroll" && (
        <div className="card">
          <div className="row">
            <div className="card-title">Payroll</div>
            <select style={{ width: "auto" }} value={month} onChange={(e) => setMonth(e.target.value)}>
              {monthsForBiz(business).map((mk) => (
                <option key={mk} value={mk}>{fmtMonth(mk)}</option>
              ))}
            </select>
          </div>
          {business.employees.length === 0 && (
            <div className="muted" style={{ marginTop: 12 }}>No employees yet.</div>
          )}
          {business.employees.map((emp) => {
            const p = payrollFor(business, emp, month);
            return (
              <div key={emp.id} className="pay-box">
                <div className="row">
                  <div style={{ fontWeight: 700, fontSize: 17 }}>{emp.name}</div>
                  <div className="big-amount">{fmtMoney(p.net)}</div>
                </div>
                <div className="pay-grid">
                  <div>Present: <span className="num">{p.present}d</span></div>
                  <div>Half-day: <span className="num">{p.half}d</span></div>
                  <div>Leave: <span className="num">{p.leave}d</span></div>
                  <div>Gross: <span className="num">{fmtMoney(p.gross)}</span></div>
                  <div>Advances: <span className="num">−{fmtMoney(p.advances)}</span></div>
                  <div className="pay-net">Net payable</div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function EmployeeDashboard({ business, employee, onUpdate, onLogout, showToast }) {
  const [month, setMonth] = useState(monthKeyOf(todayKey()));
  const p = payrollFor(business, employee, month);
  const myAdvances = (business.advances || [])
    .filter((a) => a.employeeId === employee.id && monthKeyOf(a.date.slice(0, 10)) === month)
    .sort((a, b) => (a.date < b.date ? 1 : -1));

  const tKey = todayKey();
  const todayRec = normMark(((business.attendance || {})[tKey] || {})[employee.id]);
  const statusLabel = { P: "Present", H: "Half-day", L: "Leave" };

  const checkIn = (s) => {
    const t = nowTime();
    const attendance = { ...(business.attendance || {}) };
    attendance[tKey] = { ...(attendance[tKey] || {}), [employee.id]: { s, t, by: "emp" } };
    onUpdate({ ...business, attendance });
    showToast(s === "P" ? "Checked in at " + t : "Marked on leave at " + t);
  };

  return (
    <div>
      <div className="topbar">
        <div>
          <div className="eyebrow">Employee</div>
          <h2>{employee.name}</h2>
          <div className="muted">{business.name} · {fmtMoney(employee.salary)}/mo</div>
        </div>
        <button className="btn outline small" onClick={onLogout}>Log out</button>
      </div>

      <div className="card">
        <div className="card-title">Today — {fmtLongDate(new Date())}</div>
        {todayRec ? (
          <div style={{ marginTop: 10 }}>
            <span className={"status " + todayRec.s}>
              {statusLabel[todayRec.s]}{todayRec.t ? " · " + todayRec.t : ""}
            </span>
            <span className="muted"> {todayRec.by === "emp" ? "(marked by you)" : "(marked by admin)"}</span>
            <div className="muted" style={{ marginTop: 6 }}>Need a change? Ask your admin.</div>
          </div>
        ) : (
          <div className="actions" style={{ display: "flex", gap: 10, marginTop: 12 }}>
            <button className="chip green" onClick={() => checkIn("P")}>Check in — Present</button>
            <button className="chip red" onClick={() => checkIn("L")}>On leave today</button>
          </div>
        )}
      </div>

      <div className="card">
        <div className="row">
          <div className="card-title">Your month</div>
          <select style={{ width: "auto" }} value={month} onChange={(e) => setMonth(e.target.value)}>
            {monthsForBiz(business).map((mk) => (
              <option key={mk} value={mk}>{fmtMonth(mk)}</option>
            ))}
          </select>
        </div>
        <div className="pay-box">
          <div className="row">
            <div style={{ fontWeight: 700 }}>Net payable</div>
            <div className="big-amount">{fmtMoney(p.net)}</div>
          </div>
          <div className="pay-grid">
            <div>Present: <span className="num">{p.present}d</span></div>
            <div>Half-day: <span className="num">{p.half}d</span></div>
            <div>Leave: <span className="num">{p.leave}d</span></div>
            <div>Gross: <span className="num">{fmtMoney(p.gross)}</span></div>
            <div>Advances: <span className="num">−{fmtMoney(p.advances)}</span></div>
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-title">Advances taken</div>
        {myAdvances.length === 0 && <div className="muted" style={{ marginTop: 10 }}>None this month.</div>}
        {myAdvances.map((a) => (
          <div key={a.id} className="list-item row">
            <div className="muted">{fmtDate(a.date)}</div>
            <div style={{ fontWeight: 700 }}>{fmtMoney(a.amount)}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function SuperDashboard({ businesses, onDelete, onLogout }) {
  const [openId, setOpenId] = useState(null);
  return (
    <div>
      <div className="topbar">
        <div>
          <div className="eyebrow">Platform owner</div>
          <h2>{businesses.length} business{businesses.length === 1 ? "" : "es"} registered</h2>
        </div>
        <button className="btn outline small" onClick={onLogout}>Log out</button>
      </div>
      <div className="muted" style={{ marginBottom: 14 }}>
        Support view — owner PINs are visible here so you can help users who are locked out.
      </div>
      {businesses.length === 0 && <div className="card muted">No businesses registered yet.</div>}
      {businesses.map((b) => (
        <div key={b.id} className="card">
          <div className="row">
            <div>
              <div style={{ fontWeight: 700, fontSize: 17 }}>{b.name}</div>
              <div className="muted">
                Created {fmtDate(b.createdAt)} · {b.employees.length} employee{b.employees.length === 1 ? "" : "s"}
              </div>
            </div>
            <button className="btn ghost small" onClick={() => setOpenId(openId === b.id ? null : b.id)}>
              {openId === b.id ? "Hide" : "Details"}
            </button>
          </div>
          {openId === b.id && (
            <div style={{ marginTop: 12 }}>
              <div style={{ marginBottom: 10 }}>
                Admin PIN: <span className="pill">{b.pin}</span>
              </div>
              {b.employees.map((emp) => (
                <div key={emp.id} className="list-item">
                  <span style={{ fontWeight: 600 }}>{emp.name}</span>
                  <span className="muted"> · {emp.phone} · {fmtMoney(emp.salary)}/mo · PIN {emp.pin}</span>
                </div>
              ))}
              <ConfirmButton className="btn red" label="Delete this business" confirmLabel="Tap again to delete permanently"
                onConfirm={() => onDelete(b.id)} />
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

function App() {
  const [data, setData] = useState(loadData);
  const [session, setSession] = useState(null);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  useEffect(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }, [data]);

  const showToast = (msg, kind) => {
    clearTimeout(toastTimer.current);
    setToast({ msg, kind: kind || "ok" });
    toastTimer.current = setTimeout(() => setToast(null), 3200);
  };

  const updateBusiness = (updated) => {
    setData((d) => ({
      ...d,
      businesses: d.businesses.map((b) => (b.id === updated.id ? updated : b)),
    }));
  };

  const signup = ({ name, pin }) => {
    const biz = {
      id: uid(), name, pin,
      createdAt: new Date().toISOString(),
      employees: [], attendance: {}, advances: [],
    };
    setData((d) => ({ ...d, businesses: [...d.businesses, biz] }));
    setSession({ role: "admin", businessId: biz.id });
    showToast('"' + name + '" created — you are logged in');
  };

  const deleteBusiness = (bizId) => {
    setData((d) => ({ ...d, businesses: d.businesses.filter((b) => b.id !== bizId) }));
    showToast("Business deleted");
  };

  const logout = () => setSession(null);

  let screen;
  if (!session) {
    screen = (
      <Landing
        businesses={data.businesses}
        showToast={showToast}
        onAdminLogin={(businessId) => setSession({ role: "admin", businessId })}
        onSignup={signup}
        onEmployeeLogin={(businessId, employeeId) => setSession({ role: "employee", businessId, employeeId })}
        onSuperLogin={() => setSession({ role: "super" })}
      />
    );
  } else if (session.role === "super") {
    screen = <SuperDashboard businesses={data.businesses} onDelete={deleteBusiness} onLogout={logout} />;
  } else {
    const biz = data.businesses.find((b) => b.id === session.businessId);
    if (!biz) {
      screen = null;
      setTimeout(logout, 0);
    } else if (session.role === "admin") {
      screen = <AdminDashboard business={biz} onUpdate={updateBusiness} onLogout={logout} showToast={showToast} />;
    } else {
      const emp = biz.employees.find((x) => x.id === session.employeeId);
      if (!emp) { screen = null; setTimeout(logout, 0); }
      else screen = <EmployeeDashboard business={biz} employee={emp} onUpdate={updateBusiness} onLogout={logout} showToast={showToast} />;
    }
  }

  return (
    <div className="shell">
      {toast && <div className={"toast " + toast.kind}>{toast.msg}</div>}
      {screen}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
